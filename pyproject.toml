[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cue2list"
dynamic = ["version"]
description = "Convert CD Audio CUE sheets (.cue) into a Markdown or plain-text tracklist."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "elkarrde", email = "nfalica@gmail.com" }]
keywords = ["cue", "cuesheet", "tracklist", "markdown", "cd-audio"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://codeberg.org/elkarrde/Cue2List"
Repository = "https://codeberg.org/elkarrde/Cue2List"
Mirror = "https://github.com/elkarrde/cue2list"

[project.scripts]
cue2lst = "cue2lst:main"

[tool.setuptools]
py-modules = ["cue2lst"]

[tool.setuptools.dynamic]
version = { attr = "cue2lst.__version__" }
